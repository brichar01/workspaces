name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}

services:
  workspaces_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORKSPACES_BASE_IMAGE: ${WORKSPACES_BASE_IMAGE:-workspaces_base:dev}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: ${WORKSPACE_IMAGE:?set WORKSPACE_IMAGE in .env}
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Idle until an extension's compose.yaml supplies a long-running command.
    command: ["sleep", "infinity"]
    env_file:
      - .env
    volumes:
      - .:/workspace
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
