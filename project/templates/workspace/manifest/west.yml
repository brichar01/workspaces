# West manifest for this workspace.
#
# Resolved on the HOST: `west` and git network access never move into the
# container. The workspace root is the west topdir; this file lives in
# manifest/ because west requires the manifest repository to be a subdirectory
# of the topdir.
manifest:
  version: "0.13"

  self:
    path: manifest

  # Add the repositories this workspace develops together. Each becomes a
  # subdirectory of the workspace and must be listed in .gitignore. Set
  # `submodules: true` on any repository that has submodules.
  #
  #   - name: <dir-name>
  #     url: <clone-url>
  #     revision: <branch-or-sha>
  #     path: <dir-name>
  projects: []
